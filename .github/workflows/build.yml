name: Feature Branch Libraries build

on: [ push, pull_request ]

jobs:
  build-job:
    runs-on: ubuntu-latest # enables hardware acceleration in the virtual machine
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21


      - name: Print git commit variables
        run: |
          echo "TAG: $CURRENT_TAG"

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      # Use --no-daemon only if you must. With setup-gradle, the build runs efficiently without a long-lived daemon anyway.
      - name: Build and Test (PR)
        if: github.event_name == 'pull_request'
        run: |
          ./gradlew --stacktrace \
            -Dorg.gradle.caching=true \
            -Dorg.gradle.configuration-cache=true \
            -Dorg.gradle.parallel=true \
            clean assemble allTests

      - name: Build and Test (push)
        if: github.event_name != 'pull_request'
        run: |
          ./gradlew --stacktrace \
            -Dorg.gradle.caching=true \
            -Dorg.gradle.configuration-cache=true \
            -Dorg.gradle.parallel=true \
             assemble allTests

  official-tck:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync official TCK
        run: ./scripts/sync-official-tck.sh

      - name: Run official TCK harness
        run: ./run-official-tck.sh
