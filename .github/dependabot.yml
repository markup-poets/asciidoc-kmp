version: 2
updates:
  # Target develop, not main: dependency bumps are regular feature work under
  # Git Flow (see docs/modules/ROOT/pages/contributing/branching-model.adoc)
  # and ride along in the next regular release rather than going straight to main.
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "develop"
    open-pull-requests-limit: 30
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "daily"
