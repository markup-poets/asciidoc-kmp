name: asciidoc-kmp
title: AsciiDoc Converter
version: ~
nav:
  - modules/ROOT/nav.adoc

asciidoc:
  attributes:
    artifact-version: '0.1.3'
    maven-group: 'org.markup-poet'
    # TCK status — the ONLY place these numbers live; pages reference the attributes
    # tck-commit must equal tck-quality-testing/official-tck/tck-pin.txt;
    # tck-version is `git describe --tags` of that commit in the TCK repository
    tck-commit: 'cdfada9c2768b164eadf4bc12e9f9c68e6caf68a'
    tck-commit-short: 'cdfada9c'
    tck-version: '0.1.0-25-gcdfada9'
    tck-passing: '13'
    tck-failing: '0'
    tck-skipped: '0'
    tck-total: '13'
    java-min: '11'
    android-min-api: '24'
    node-min: '20'
    url-repo: 'https://github.com/markup-poets/asciidoc-kmp'
    url-tck: 'https://gitlab.eclipse.org/eclipse/asciidoc-lang/asciidoc-tck'
    url-spec: 'https://gitlab.eclipse.org/eclipse/asciidoc-lang/asciidoc-lang'
    url-maven-central: 'https://central.sonatype.com/namespace/org.markup-poet'
    url-dsl-poet: 'https://markup-poets.github.io/markup-poets/'
    url-dsl-poet-repo: 'https://github.com/markup-poets/markup-poets'
